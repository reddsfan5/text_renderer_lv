version: 2

# 公共运行参数。命令行参数优先于这里的值。
runtime:
  num_processes: 3
  log_period: 2
  # 有界队列避免大量高分辨率图片同时驻留内存。
  queue_size: 64
  # 每个进程池任务连续生成的图片数，减少百万级任务的调度开销。
  task_batch_size: 8

storage:
  dataset: lmdb
  jpg_quality: 95
  lmdb_map_size_mb: 512
  lmdb_cache_size: 500
  lmdb_map_increment_mb: 256

generator:
  # 可同时启用多个语言，也可用 --language 临时覆盖。
  active_languages: [russian] # [callnumber, chinese, korean, japanese, french, spanish, russian, german, tibetan]
  num_images: 1000
  output_dir: "F:/dataset/OCR/3.text_rec/synthesis/rec_pieces/syn_ocr_{timestamp}/{language}"

# 背景和渲染参数默认由所有语言共享；语言档案内可按需覆盖。
background:
  dir: "D:/lxd_code/OCR/OCR_SOURCE/bg/bg_pure"
  preload: true

render:
  write_mode: oneline
  # 文字颜色方案（二选一）：
  #   fixed     - 指定颜色，使用下方 fixed_rgb
  #   adaptive  - 基于背景均值自适应（safe 为同义别名）
  #   gray      - 随机深灰（兼容旧配置）
  text_color_strategy: adaptive
  fixed_rgb: [0, 0, 0]
  # 仅在无 text_color_strategy 对应配置、走遗留回退时生效
  text_color_mode: color
  gray_text_range: [0, 12]
  text_alpha_range: [245, 255]
  return_bg_and_mask: false
  perspective:
    enabled: false
    type: uniform
    x: 10
    y: 5
    z: 1.5
    scale: 1
    fovy: 50
  corpus_effects: []

# 每个语言档案把相互耦合的语料、字符集、字体和排版放在一起。
languages:
  korean:
    corpus:
      path: "F:/dataset/OCR/图书目录/text/korea/korean_missing_chars_corpus_10w.txt"
      charset_path: "D:/lxd_code/OCR/OCR_SOURCE/charset/chn_kor_jap_fre_rus_spa_ara_latin_tib_24188.txt"
      strip: true
      normalize_spaces: true
      remove_punctuation: true
      allowed_punctuation: "！？"
      min_length: 2
      max_length: 20
      long_text: split
      capacity_multiplier: 1.2
    font:
      dir: "D:/lxd_code/OCR/OCR_SOURCE/font/font_set/韩文"
      size: [30, 36]
    text:
      orientation: vertical
      rotate_characters: true
      clip_length: 20
      char_spacing: 0
      join_str: ""

  callnumber:
    corpus:
      path: "D:/lxd_code/OCR/OCR_SOURCE/corpus/call_number/bjcy_callnumber_100w_with_parentheses.txt"
      charset_path: "D:/lxd_code/OCR/OCR_SOURCE/charset/chn_kor_jap_fre_rus_spa_ara_latin_tib_24188.txt"
